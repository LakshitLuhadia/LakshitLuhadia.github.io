<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0D}
a{color:#F4F4F5;text-decoration:none}
button{cursor:pointer}
</style>
</helmet>
<div style="min-height: 620px; background: #0B0B0D; color: #F4F4F5; font-family: 'Barlow Condensed', sans-serif; display: flex; flex-wrap: wrap; align-content: space-between; overflow: hidden">

  <nav aria-label="Sections" style="flex: 0 0 76px; border-right: 1px solid #26262B; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 28px 0; box-sizing: border-box">
    <div style="font-weight: 900; font-size: 28px; letter-spacing: 1px; color: #FF3B30">LL</div>
    <div style="writing-mode: vertical-rl; transform: rotate(180deg); display: flex; flex-direction: row-reverse; gap: 32px; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 3px; text-transform: uppercase">
      <a href="Main.dc.html" style="color: #A1A1AA">01 Home</a>
      <a href="Work.dc.html" style="color: #A1A1AA">02 Work</a>
      <a href="Contact.dc.html" style="color: #F4F4F5">03 Contact</a>
    </div>
    <div style="width: 14px; height: 14px; background: repeating-conic-gradient(#F4F4F5 0% 25%, #0B0B0D 0% 50%) 0 0 / 7px 7px"></div>
  </nav>

  <main style="flex: 1 1 560px; min-width: 0; padding: 28px 48px 56px 56px; box-sizing: border-box">
    <div style="display: flex; flex-wrap: wrap; gap: 56px; margin-top: 48px; align-items: flex-end">

      <section style="flex: 1 1 340px; max-width: 560px">
        <h1 style="margin: 0; font-weight: 900; font-size: 96px; line-height: 0.82; text-transform: uppercase">Let's<br><span style="color: #FF3B30; margin-left: 14%">talk.</span></h1>
        <p style="margin: 24px 0 0 14%; font-size: 22px; line-height: 1.2; color: #D4D4D8">Open to data, ML and LLM engineering roles. The quickest way to reach me is email.</p>
        <button onClick="{{ copy }}" style="display: inline-flex; align-items: center; gap: 16px; margin: 28px 0 0 14%; min-height: 56px; padding: 0 20px; background: #FF3B30; color: #0B0B0D; border: 0; font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600">
          <span>lakshitluhadia2212@gmail.com</span>
          <span aria-live="polite" style="font-size: 12px; letter-spacing: 2px; border-left: 2px solid #0B0B0D; padding-left: 16px">{{ copyLabel }}</span>
        </button>
      </section>

      <section style="flex: 0 1 420px; margin-left: auto; display: grid; gap: 0; background: #151518; border-left: 6px solid #FF3B30; clip-path: polygon(0 0, 100% 0, 100% 100%, 10% 100%, 0 92%)">
        <a href="https://github.com/LakshitLuhadia" style="display: flex; justify-content: space-between; align-items: center; min-height: 72px; padding: 0 28px; border-bottom: 1px solid #26262B; font-weight: 900; font-size: 32px; text-transform: uppercase">GitHub <span style="color: #FF3B30">↗</span></a>
        <a href="https://www.linkedin.com/in/lluhadia/" style="display: flex; justify-content: space-between; align-items: center; min-height: 72px; padding: 0 28px; border-bottom: 1px solid #26262B; font-weight: 900; font-size: 32px; text-transform: uppercase">LinkedIn <span style="color: #FF3B30">↗</span></a>
        <div style="padding: 20px 28px 36px">
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 3px; color: #A1A1AA">WATERLOO, ONTARIO · LOCAL TIME</div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 40px; font-weight: 600; margin-top: 6px">{{ clock }}</div>
        </div>
      </section>
    </div>
  </main>
  <div style="flex: 0 0 100%"><dc-import name="FooterSessions" hint-size="100%,140px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":620}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { copied: false, now: Date.now() };
  }
  componentDidMount() {
    this.tick = setInterval(() => this.setState({ now: Date.now() }), 30000);
  }
  componentWillUnmount() {
    clearInterval(this.tick);
    clearTimeout(this.reset);
  }
  renderVals() {
    const email = 'lakshitluhadia2212@gmail.com';
    let clock = '--:--';
    try {
      clock = new Intl.DateTimeFormat('en-CA', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'America/Toronto' }).format(new Date(this.state.now));
    } catch (err) {}
    return {
      clock,
      copyLabel: this.state.copied ? 'COPIED' : 'COPY',
      copy: () => {
        try { navigator.clipboard.writeText(email); } catch (err) {}
        this.setState({ copied: true });
        clearTimeout(this.reset);
        this.reset = setTimeout(() => this.setState({ copied: false }), 2000);
      },
    };
  }
}
</script>
</body>
</html>
