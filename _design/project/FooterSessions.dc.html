<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Footer sessions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0D}
</style>
</helmet><footer style="box-sizing: border-box; width: 100%; background: #0B0B0D; border-top: 1px solid #26262B; padding: 20px 48px 20px 132px; color: #F4F4F5; font-family: 'Barlow Condensed', sans-serif; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 36px">
  <div style="flex: 0 0 auto">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 3px; color: #A1A1AA">WEEKEND SCHEDULE · ROUND {{ round }}</div>
    <div style="font-weight: 900; font-size: 30px; line-height: 1; text-transform: uppercase; margin-top: 6px">{{ gp }}</div>
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 1px; color: #A1A1AA; margin-top: 4px">Your time zone: {{ tz }} · {{ upNext }}</div>
  </div>
  <ol style="flex: 1 1 400px; list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end">
    <sc-for list="{{items}}" as="s" hint-placeholder-count="5">
      <li style="min-width: 108px; padding: 8px 12px; border: 1px solid {{ s.border }}; border-top: 4px solid {{ s.top }}; background: {{ s.bg }}; opacity: {{ s.op }}">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 2px; color: #A1A1AA">{{ s.day }}</div>
        <div style="font-weight: 700; font-size: 20px; line-height: 1.1; text-transform: uppercase; margin-top: 2px">{{ s.label }}</div>
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; margin-top: 2px">{{ s.time }}</div>
      </li>
    </sc-for>
  </ol>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":140}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { now: Date.now() };
  }
  componentDidMount() { this.tick = setInterval(() => this.setState({ now: Date.now() }), 60000); }
  componentWillUnmount() { clearInterval(this.tick); }
  renderVals() {
    const now = this.state.now;
    const rounds = [
      { round: 16, gp: 'Bahrain GP in Malaysia', s: [['FP1', '2026-10-02T04:30:00Z'], ['FP2', '2026-10-02T08:00:00Z'], ['FP3', '2026-10-03T04:30:00Z'], ['Qualifying', '2026-10-03T08:00:00Z'], ['Race', '2026-10-04T07:00:00Z']] },
      { round: 17, gp: 'Singapore GP', s: [['FP1', '2026-10-09T08:30:00Z'], ['Sprint Qualifying', '2026-10-09T12:30:00Z'], ['Sprint', '2026-10-10T09:00:00Z'], ['Qualifying', '2026-10-10T13:00:00Z'], ['Race', '2026-10-11T12:00:00Z']] },
      { round: 18, gp: 'United States GP', s: [['FP1', '2026-10-23T17:30:00Z'], ['FP2', '2026-10-23T21:00:00Z'], ['FP3', '2026-10-24T17:30:00Z'], ['Qualifying', '2026-10-24T21:00:00Z'], ['Race', '2026-10-25T20:00:00Z']] },
      { round: 19, gp: 'Mexico City GP', s: [['FP1', '2026-10-30T18:30:00Z'], ['FP2', '2026-10-30T22:00:00Z'], ['FP3', '2026-10-31T17:30:00Z'], ['Qualifying', '2026-10-31T21:00:00Z'], ['Race', '2026-11-01T20:00:00Z']] },
      { round: 20, gp: 'São Paulo GP', s: [['FP1', '2026-11-06T15:30:00Z'], ['FP2', '2026-11-06T19:00:00Z'], ['FP3', '2026-11-07T14:30:00Z'], ['Qualifying', '2026-11-07T18:00:00Z'], ['Race', '2026-11-08T17:00:00Z']] },
      { round: 21, gp: 'Las Vegas GP', s: [['FP1', '2026-11-20T00:30:00Z'], ['FP2', '2026-11-20T04:00:00Z'], ['FP3', '2026-11-21T00:30:00Z'], ['Qualifying', '2026-11-21T04:00:00Z'], ['Race', '2026-11-22T04:00:00Z']] },
      { round: 22, gp: 'Qatar GP', s: [['FP1', '2026-11-27T13:30:00Z'], ['FP2', '2026-11-27T17:00:00Z'], ['FP3', '2026-11-28T14:30:00Z'], ['Qualifying', '2026-11-28T18:00:00Z'], ['Race', '2026-11-29T16:00:00Z']] },
      { round: 23, gp: 'Abu Dhabi GP', s: [['FP1', '2026-12-04T09:30:00Z'], ['FP2', '2026-12-04T13:00:00Z'], ['FP3', '2026-12-05T10:30:00Z'], ['Qualifying', '2026-12-05T14:00:00Z'], ['Race', '2026-12-06T13:00:00Z']] },
    ];
    const open = rounds.filter((r) => now <= new Date(r.s[r.s.length - 1][1]).getTime() + 2 * 3600000);
    const cur = (open.length ? open : rounds.slice(-1))[0];
    let tz = 'local time';
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || tz; } catch (err) {}
    const fmtDay = (d) => { try { return new Intl.DateTimeFormat('en-CA', { weekday: 'short', month: 'short', day: 'numeric' }).format(d).toUpperCase(); } catch (err) { return ''; } };
    const fmtTime = (d) => { try { return new Intl.DateTimeFormat('en-CA', { hour: '2-digit', minute: '2-digit', hour12: false }).format(d); } catch (err) { return ''; } };
    const nextIdx = cur.s.findIndex((x) => new Date(x[1]).getTime() > now);
    const items = cur.s.map((x, i) => {
      const d = new Date(x[1]);
      const past = d.getTime() <= now;
      const isNext = i === nextIdx;
      return {
        label: x[0], day: fmtDay(d), time: fmtTime(d),
        border: isNext ? '#FF3B30' : '#26262B', top: isNext ? '#FF3B30' : '#3A3A42', bg: isNext ? '#151518' : 'transparent', op: past ? 0.55 : 1,
      };
    });
    let upNext = 'weekend finished';
    if (nextIdx >= 0) {
      const mins = Math.max(0, Math.round((new Date(cur.s[nextIdx][1]).getTime() - now) / 60000));
      const when = mins >= 2880 ? Math.floor(mins / 1440) + ' days' : mins >= 60 ? Math.floor(mins / 60) + 'h ' + (mins % 60) + 'm' : mins + ' min';
      upNext = 'next: ' + cur.s[nextIdx][0] + ' in ' + when;
    }
    return { round: cur.round, gp: cur.gp, tz, items, upNext };
  }
}
</script>
</body>
</html>
